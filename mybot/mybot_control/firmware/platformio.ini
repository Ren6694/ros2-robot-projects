; ============================================================================
; mybot · P3 固件工程（ESP32 + Arduino framework）
;
; 平台从 dl.platformio.org 拉，**不经 GitHub** —— 这是 09-20 换分发源的关键：
; arduino-cli 的 esp32 工具链索引里全是 github.com/espressif/releases，本机到 GitHub
; 连浏览器一起超时，装不动；PIO 的同一套 GCC + esptool 走 AWS，实测 200 可达。
;
; 板子型号先按最常见的 DevKit-C V4（30Pin，USB 口在 CP2102 那侧）写；
; 实际到货如果不是这块，只改 board 一行。
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 上传波特率：CP2102 走 921600 偶尔掉，先保守写 460800
upload_speed = 460800
